<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil - TUDO 10</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
  <header id="topo"></header>
  <nav class="sub-nav" id="menu"></nav>
  <main class="main-container">
    <div class="form-box">
      <h2 style="margin-bottom: 20px; text-align: center;">Dados do Usuário</h2>
      <form id="formPerfil">
        <div class="form-group"><label>Nome completo</label><input name="nome" required maxlength="50"></div>
        <div class="form-group"><label>E-mail</label><input name="email" type="email" readonly></div>
        <div class="form-group"><label>CPF</label><input name="cpf" readonly></div>
        <div class="form-group"><label>Telefone</label><input name="telefone" data-mask="telefone" maxlength="15" inputmode="numeric" required></div>
        <div class="form-group"><label>CEP</label><input name="cep" data-mask="cep" maxlength="9" inputmode="numeric" required></div>
        <div class="form-group"><label>Endereço</label><input name="endereco" maxlength="80" required></div>
        <button class="btn-primary" style="width: 100%;">Salvar alterações</button>
      </form>
      <button class="btn-primary" id="btnSair" style="width: 100%; margin-top: 10px; background-color: #ef4444;">Sair da conta</button>
      <button class="theme-toggle" id="btnExcluir" style="width: 100%; margin-top: 10px;">Excluir minha conta</button>
    </div>
  </main>
  <footer id="rodape"></footer>
</body>
</html>
